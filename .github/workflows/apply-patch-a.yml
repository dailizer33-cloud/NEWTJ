# Triggered for guarded Patch A execution
name: Apply Patch A

on:
  push:
    branches:
      - patch/a-c-risk-fixes
    paths:
      - '.github/workflows/apply-patch-a.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-a:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: patch/a-c-risk-fixes

      - name: Verify branch and baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "patch/a-c-risk-fixes"
          test "$(git rev-parse HEAD:main.lua)" = "31eff10aec9a881bf4554692ad105bfeaa967d12"
          test "$(wc -c < main.lua)" -ge 300000
          test "$(wc -l < main.lua)" -ge 6000

      - name: Apply Patch A only
        shell: python
        run: |
          from pathlib import Path

          path = Path("main.lua")
          source = path.read_text(encoding="utf-8")
          replacements = [
              ("if warpActive and not isBusy then",
               "if warpActive and not Main.State.isBusy then",
               "A1"),
              ("elseif isBusy then",
               "elseif Main.State.isBusy then",
               "A2"),
          ]

          for old, new, label in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Patch {label} guard failed: expected 1 match, found {count}")
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8")

      - name: Review exact diff before commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- . ':!main.lua'
          test "$(git diff --numstat -- main.lua | awk '{print $1}')" = "2"
          test "$(git diff --numstat -- main.lua | awk '{print $2}')" = "2"
          grep -qF 'if warpActive and not Main.State.isBusy then' main.lua
          grep -qF 'elseif Main.State.isBusy then' main.lua
          ! grep -qF 'if warpActive and not isBusy then' main.lua
          git diff -- main.lua

      - name: Run static checks before commit
        shell: bash
        run: |
          set -euo pipefail
          bash static-check.sh main.lua
          git diff --check
          test "$(wc -c < main.lua)" -ge 300000
          test "$(wc -l < main.lua)" -ge 6000

      - name: Commit Patch A only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.lua
          test "$(git diff --cached --name-only)" = "main.lua"
          git commit -m "fix(warp): use canonical busy state"
          git push origin HEAD:patch/a-c-risk-fixes
