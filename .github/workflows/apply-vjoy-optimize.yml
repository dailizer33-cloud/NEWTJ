name: Optimize Virtual Joystick

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-vjoy-optimize.yml'
      - 'tools/apply_vjoy_optimize.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize vjoy
        run: |
          set -euo pipefail
          python3 tools/apply_vjoy_optimize.py
          grep -q VJOY_OPT main.lua
          grep -q monsterVjoyDirSmoothed main.lua
          grep -q MONSTER_VJOY_DEADZONE main.lua
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.lua
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "perf: optimize virtual joystick - smooth dir, deadzone, cached Humanoid"
          git push origin HEAD:main
