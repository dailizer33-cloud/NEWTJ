name: Apply Skill Hybrid to main.lua

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-skill-hybrid.yml'
      - 'tools/apply_skill_hybrid.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate SkillHybrid into main.lua
        run: |
          set -euo pipefail
          python3 tools/apply_skill_hybrid.py
          test "$(wc -c < main.lua)" -gt 100000
          grep -q skillFireBite main.lua
          ! grep -q 'farmTapButton(bite)' main.lua
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.lua
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m "feat: main.lua SkillHybrid - Bite/Move via AntRemotes (remove GUI tap combat)"
          git push origin HEAD:main
