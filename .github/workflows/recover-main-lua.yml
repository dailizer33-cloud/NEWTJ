name: Recover main.lua

on:
  push:
    paths:
      - '.github/workflows/recover-main-lua.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore main.lua from frozen Phase 19 baseline
        run: |
          git checkout 82823cb11afa2e537cf55f4159f4e10f5e260085 -- main.lua
          test "$(wc -c < main.lua)" -gt 100000
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.lua
          git diff --cached --quiet && exit 0
          git commit -m "recovery: restore main.lua from phase19 baseline"
          git push origin HEAD:main
