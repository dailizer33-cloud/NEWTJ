name: Apply Virtual Joystick + Warp Collect

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-vjoy-warp-collect.yml'
      - 'tools/apply_vjoy_warp_collect.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply virtual joystick movement and warp collect
        run: |
          set -euo pipefail
          python3 tools/apply_vjoy_warp_collect.py
          grep -q 'VIRTUAL JOYSTICK MOVEMENT' main.lua
          grep -q 'MONSTER_WALK_SPEED = 80' main.lua
          grep -q farmWarpCollectLoot main.lua
          ! grep -q 'MONSTER_WALK_NEAR' main.lua
          ! grep -q farmCollectNearbyOrbs main.lua
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.lua
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m "feat: virtual joystick WalkSpeed 80 + warp collect orb/acorn/buff/event"
          git push origin HEAD:main
