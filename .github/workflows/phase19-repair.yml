name: Phase 19A commit main.lua

on:
  push:
    branches: [main]
    paths: ['.github/workflows/phase19-repair.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit-phase19a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check if Phase 19A is already applied
        shell: bash
        run: |
          set -euo pipefail
          if grep -qF 'function Main:IsBusy()' main.lua && grep -qF 'function Main:SetBusy(value, owner)' main.lua && ! grep -qF 'Main.isBusy' main.lua; then
            echo 'Phase 19A already applied, skipping'
            exit 0
          fi

      - name: Apply Phase 19A safely
        shell: bash
        run: |
          set -euo pipefail
          test -f main.lua
          test "$(wc -c < main.lua)" -ge 300000
          cp main.lua /tmp/main.lua.phase19a.before
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('main.lua')
          raw = p.read_bytes()
          newline = '\r\n' if b'\r\n' in raw else '\n'
          s = raw.decode('utf-8').replace('\r\n', '\n')
          before = s

          bootstrap = re.compile(
              r'if State\.originalWalkSpeed == nil then State\.originalWalkSpeed = Main\.originalWalkSpeed end\n'
              r'if State\.isBusy == nil then State\.isBusy = Main\.isBusy == true end\n'
              r'-- Legacy feature modules keep the same table references\. Scalar runtime values\n'
              r'-- are stored in State and mirrored to legacy fields only when changed\.\n'
              r'Main\.config, Main\.states = config, states\n'
              r'Main\.originalWalkSpeed, Main\.isBusy = State\.originalWalkSpeed, State\.isBusy\n'
              r'TJ\.Main = Main'
          )
          replacement = '''if State.originalWalkSpeed == nil then State.originalWalkSpeed = Main.originalWalkSpeed end
if State.isBusy == nil then State.isBusy = false end
State.busyOwner = State.isBusy and State.busyOwner or nil
function Main:IsBusy()
    return self.State.isBusy == true
end
function Main:SetBusy(value, owner)
    local busy = value == true
    self.State.isBusy = busy
    self.State.busyOwner = busy and tostring(owner or "UNKNOWN") or nil
    return busy
end
Main.config, Main.states = config, states
Main.originalWalkSpeed = State.originalWalkSpeed
TJ.Main = Main'''
          s, n = bootstrap.subn(replacement, s, count=1)
          if n == 0 and 'function Main:SetBusy(value, owner)' not in s:
              raise SystemExit('Phase 19A bootstrap not found')

          rules = [
              (r'local state = Main\.State\n\s*local busy = \(state and state\.isBusy == true\) or Main\.isBusy == true', 'local busy = Main:IsBusy()'),
              (r'\bif\s+warpActive\s+and\s+not\s+isBusy\s+then\b', 'if warpActive and not Main:IsBusy() then'),
              (r'\belseif\s+isBusy\s+then\b', 'elseif Main:IsBusy() then'),
              (r'\bif\s+isBusy\s+or\s+flyNowe\s+or\s+states\.Fly\s+or\s+targetPlayer\s*==\s*LocalPlayer\s+then\s+return\s+end', 'if Main:IsBusy() or flyNowe or states.Fly or targetPlayer == LocalPlayer then return end'),
              (r'(?m)^(\s*)isBusy\s*=\s*true\s*$', r'\1Main:SetBusy(true, "MM2")'),
              (r'(?m)^(\s*)isBusy\s*=\s*false\s*$', r'\1Main:SetBusy(false, "MM2")'),
          ]
          for pattern, repl in rules:
              s = re.sub(pattern, repl, s)

          if 'Main.isBusy' in s:
              raise SystemExit('legacy Main.isBusy remains')
          if 'function Main:IsBusy()' not in s or 'function Main:SetBusy(value, owner)' not in s:
              raise SystemExit('canonical busy API missing')
          if s == before:
              raise SystemExit('no main.lua changes produced')

          p.write_bytes(s.replace('\n', newline).encode('utf-8'))
          print('Phase 19A updated main.lua')
          PY

          test "$(wc -c < main.lua)" -ge 300000
          grep -qF 'function Main:IsBusy()' main.lua
          grep -qF 'function Main:SetBusy(value, owner)' main.lua
          ! grep -qF 'Main.isBusy' main.lua
          if [ -f static-check.sh ]; then bash static-check.sh main.lua; fi

      - name: Commit main.lua
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- main.lua
          git diff --cached --check
          git commit -m 'refactor: make State.isBusy canonical'
          git push origin HEAD:main
