name: Phase 19 repair and validation

# Trigger nonce: approved-retry-2026-11-25-0041
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase19-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('main.lua'); s=p.read_text(encoding='utf-8'); old=s
          a=''' title.TextStrokeTransparency = 1
