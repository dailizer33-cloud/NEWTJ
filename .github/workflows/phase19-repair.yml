})
titleGradient.Parent = title'''
          if a not in s: raise SystemExit('logo corruption marker missing')
          s=s.replace(a,b,1)
          a='''local function corner(parent, radius)
    ui("UICorner", {CornerRadius=UDim.new(0, radius or 10)}, parent)
end
end
local panel = ui('''
          b='''local function corner(parent, radius)
    ui("UICorner", {CornerRadius=UDim.new(0, radius or 10)}, parent)
end
local panel = ui('''
          if a not in s: raise SystemExit('FPS scope corruption marker missing')
          s=s.replace(a,b,1)
          s=s.replace('if warpActive and not isBusy then','if warpActive and not Main.State.isBusy then')
          s=s.replace('elseif isBusy then','elseif Main.State.isBusy then')
