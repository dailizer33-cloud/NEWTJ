name: Phase 19 repair and validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase19-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase19-repair-main
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify source and backup
        shell: bash
        run: |
          set -euo pipefail
          test -f main.lua
          test "$(wc -c < main.lua)" -ge 300000
          git fetch origin backup/pre-phase19:refs/remotes/origin/backup/pre-phase19
          git rev-parse --verify refs/remotes/origin/backup/pre-phase19
          cp main.lua /tmp/main.lua.before-phase19

      - name: Repair real main.lua
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('main.lua')
          raw = path.read_bytes()
          newline = '\r\n' if b'\r\n' in raw else '\n'
          text = raw.decode('utf-8').replace('\r\n', '\n')
          before = text
          changes = []

          if 'titleGradient.Parent = title' not in text:
              logo = re.compile(
                  r'(?m)^[ \t]*title\.TextStrokeTransparency\s*=\s*1\s*\n'
                  r'(?P<keys>(?:[ \t]*ColorSequenceKeypoint\.new\([^\n]+\),?\s*\n){7})'
                  r'[ \t]*\}\)'
              )
              m = logo.search(text)
              if not m:
                  raise SystemExit('orphaned logo gradient block not found')
              keys = ''.join('    ' + line.strip() + '\n' for line in m.group('keys').splitlines())
              fixed = (
                  'title.TextStrokeColor3 = Color3.fromRGB(8, 18, 34)\n'
                  'title.TextStrokeTransparency = 0.18\n'
                  'local titleGradient = Instance.new("UIGradient")\n'
                  'titleGradient.Name = "TayJayBrandGradient"\n'
                  'titleGradient.Color = ColorSequence.new({\n' + keys + '})\n'
                  'titleGradient.Parent = title'
              )
              text = text[:m.start()] + fixed + text[m.end():]
              changes.append('logo-gradient')

          fps = re.compile(
              r'(local function corner\(parent\s*,\s*radius\)\s*\n'
              r'[ \t]*ui\("UICorner"[^\n]*\)\s*\n'
              r'[ \t]*end\s*\n)'
              r'[ \t]*end\s*\n'
              r'(?=[ \t]*local panel\s*=\s*ui\()'
          )
          text, n = fps.subn(r'\1', text, count=1)
          if n:
              changes.append('fps-extra-end')

          busy_pairs = [
              (r'\bif\s+warpActive\s+and\s+not\s+isBusy\s+then\b', 'if warpActive and not Main.State.isBusy then'),
              (r'\belseif\s+isBusy\s+then\b', 'elseif Main.State.isBusy then'),
              (r'\bif\s+isBusy\s+or\s+flyNowe\s+or\s+states\.Fly\s+or\s+targetPlayer\s*==\s*LocalPlayer\s+then\s+return\s+end',
               'if Main.State.isBusy or flyNowe or states.Fly or targetPlayer == LocalPlayer then return end'),
          ]
          for pattern, replacement in busy_pairs:
              text, n = re.subn(pattern, replacement, text)
              if n:
                  changes.append('busy-state')

          # Safe originalWalkSpeed transformations. Never qualify a local declaration.
          speed_rules = [
              (r'(?<![.\w])originalWalkSpeed\s*==\s*nil', 'TJ.Main.State.originalWalkSpeed == nil', 'walk-speed-nil-read'),
              (r'(?<![.\w])originalWalkSpeed\s*~=\s*nil', 'TJ.Main.State.originalWalkSpeed ~= nil', 'walk-speed-value-read'),
              (r'hum\.WalkSpeed\s*=\s*(?<![.\w])originalWalkSpeed\b', 'hum.WalkSpeed = TJ.Main.State.originalWalkSpeed', 'walk-speed-restore'),
              (r'(?<![.\w])originalWalkSpeed\s*=\s*hum\.WalkSpeed', 'TJ.Main.State.originalWalkSpeed = hum.WalkSpeed', 'walk-speed-save'),
              (r'(?m)^(?![ \t]*local\b)(?P<i>[ \t]*)originalWalkSpeed\s*=\s*nil\s*;?', r'\g<i>TJ.Main.State.originalWalkSpeed = nil', 'walk-speed-reset'),
          ]
          for pattern, replacement, label in speed_rules:
              text, n = re.subn(pattern, replacement, text)
              if n:
                  changes.append(label)

          if 'local TJ.Main.State.originalWalkSpeed' in text:
              raise SystemExit('invalid qualified local declaration')

          legacy_uses = [
              r'(?<![.\w])originalWalkSpeed\s*==\s*nil',
              r'(?<![.\w])originalWalkSpeed\s*~=\s*nil',
              r'hum\.WalkSpeed\s*=\s*(?<![.\w])originalWalkSpeed\b',
              r'(?<![.\w])originalWalkSpeed\s*=\s*hum\.WalkSpeed',
              r'(?m)^(?![ \t]*local\b)[ \t]*originalWalkSpeed\s*=\s*nil',
          ]
          remaining = [pattern for pattern in legacy_uses if re.search(pattern, text)]
          if remaining:
              raise SystemExit('unsafe originalWalkSpeed uses remain: ' + repr(remaining))

          required = [
              'titleGradient.Parent = title',
              'local panel = ui(',
              'Main.State.isBusy',
              'TJ.Main.State.originalWalkSpeed',
              'end, function(_tjErr)',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit('required repaired markers missing: ' + repr(missing))

          if text != before:
              path.write_bytes(text.replace('\n', newline).encode('utf-8'))
              print('applied:', ', '.join(changes))
          else:
              print('main.lua already satisfies repair contract')
          PY

      - name: Validate repaired source
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < main.lua)" -ge 300000
          grep -qF 'titleGradient.Parent = title' main.lua
          grep -qF 'Main.State.isBusy' main.lua
          grep -qF 'TJ.Main.State.originalWalkSpeed' main.lua
          grep -qF 'end, function(_tjErr)' main.lua
          ! grep -qF 'local TJ.Main.State.originalWalkSpeed' main.lua
          if [ -f static-check.sh ]; then bash static-check.sh main.lua; fi

      - name: Commit repaired main.lua
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- main.lua
          if git diff --cached --quiet; then
            echo 'main.lua already ready for Phase 19'
            exit 0
          fi
          git diff --cached --stat
          git commit -m 'Phase 19: repair real main.lua startup and shared state'
          git push origin HEAD:main
