name: Phase 19A canonical busy state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase19-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase19a-main
  cancel-in-progress: false

jobs:
  phase19a:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Backup and patch main.lua
        shell: bash
        run: |
          set -euo pipefail
          test -f main.lua
          test "$(wc -c < main.lua)" -ge 300000
          cp main.lua /tmp/main.lua.phase19a.before
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('main.lua')
          raw = path.read_bytes()
          newline = '\r\n' if b'\r\n' in raw else '\n'
          text = raw.decode('utf-8').replace('\r\n', '\n')
          before = text

          old = '''if State.originalWalkSpeed == nil then State.originalWalkSpeed = Main.originalWalkSpeed end
          if State.isBusy == nil then State.isBusy = Main.isBusy == true end
          -- Legacy feature modules keep the same table references. Scalar runtime values
          -- are stored in State and mirrored to legacy fields only when changed.
          Main.config, Main.states = config, states
          Main.originalWalkSpeed, Main.isBusy = State.originalWalkSpeed, State.isBusy
          TJ.Main = Main'''.replace('          ', '')
          new = '''if State.originalWalkSpeed == nil then State.originalWalkSpeed = Main.originalWalkSpeed end
          if State.isBusy == nil then State.isBusy = false end
          State.busyOwner = State.isBusy and State.busyOwner or nil
          function Main:IsBusy()
              return self.State.isBusy == true
          end
          function Main:SetBusy(value, owner)
              local busy = value == true
              self.State.isBusy = busy
              self.State.busyOwner = busy and tostring(owner or "UNKNOWN") or nil
              return busy
          end
          Main.config, Main.states = config, states
          Main.originalWalkSpeed = State.originalWalkSpeed
          Main.isBusy = nil
          TJ.Main = Main'''.replace('          ', '')
          if old in text:
              text = text.replace(old, new, 1)
          elif 'function Main:SetBusy(value, owner)' not in text:
              raise SystemExit('Phase 19A state bootstrap anchor not found')

          # Canonical reads. Do not retain fallback reads from Main.isBusy.
          text = re.sub(
              r'local state = Main\.State\n\s*local busy = \(state and state\.isBusy == true\) or Main\.isBusy == true',
              'local busy = Main:IsBusy()', text
          )
          text = re.sub(r'\bif\s+warpActive\s+and\s+not\s+isBusy\s+then\b',
                        'if warpActive and not Main:IsBusy() then', text)
          text = re.sub(r'\belseif\s+isBusy\s+then\b',
                        'elseif Main:IsBusy() then', text)
          text = re.sub(
              r'\bif\s+isBusy\s+or\s+flyNowe\s+or\s+states\.Fly\s+or\s+targetPlayer\s*==\s*LocalPlayer\s+then\s+return\s+end',
              'if Main:IsBusy() or flyNowe or states.Fly or targetPlayer == LocalPlayer then return end', text
          )

          # MM2 is the only writer of this busy gate in the current source.
          text = re.sub(r'(?m)^\s*isBusy\s*=\s*true\s*$',
                        '        Main:SetBusy(true, "MM2")', text)
          text = re.sub(r'(?m)^\s*isBusy\s*=\s*false\s*$',
                        '        Main:SetBusy(false, "MM2")', text)

          # Contract: no legacy scalar mirror and no bare isBusy references.
          forbidden = []
          if re.search(r'\bMain\.isBusy\b', text): forbidden.append('Main.isBusy')
          if re.search(r'(?<![.\w])isBusy(?![\w])', text): forbidden.append('bare isBusy')
          if forbidden:
              raise SystemExit('Phase 19A forbidden references remain: ' + ', '.join(forbidden))

          required = [
              'function Main:IsBusy()',
              'function Main:SetBusy(value, owner)',
              'self.State.isBusy = busy',
              'Main:SetBusy(true, "MM2")',
              'Main:SetBusy(false, "MM2")',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit('Phase 19A markers missing: ' + repr(missing))

          if text == before:
              print('Phase 19A already applied')
          else:
              path.write_bytes(text.replace('\n', newline).encode('utf-8'))
              print('Phase 19A patch applied')
          PY

      - name: Validate Phase 19A
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < main.lua)" -ge 300000
          grep -qF 'function Main:IsBusy()' main.lua
          grep -qF 'function Main:SetBusy(value, owner)' main.lua
          grep -qF 'Main:SetBusy(true, "MM2")' main.lua
          grep -qF 'Main:SetBusy(false, "MM2")' main.lua
          ! grep -qE '\bMain\.isBusy\b' main.lua
          ! grep -qE '(^|[^.[:alnum:]_])isBusy([^[:alnum:]_]|$)' main.lua
          if [ -f static-check.sh ]; then bash static-check.sh main.lua; fi

      - name: Commit Phase 19A
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- main.lua
          if git diff --cached --quiet; then
            echo 'Phase 19A already complete'
            exit 0
          fi
          git diff --cached --stat
          git commit -m 'refactor: make State.isBusy canonical'
          git push origin HEAD:main
