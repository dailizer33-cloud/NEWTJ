name: Soften Monster Lerp

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Soften Monster lerp
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('main.lua')
          text = path.read_text(encoding='utf-8')
          if 'MONSTER_HORIZONTAL_LERP = 0.18' in text and 'distance / 28' in text:
              print('already patched')
              raise SystemExit(0)
          old_h = 'local MONSTER_HORIZONTAL_LERP = 0.28    -- soft blend toward destination'
          new_h = 'local MONSTER_HORIZONTAL_LERP = 0.18    -- soft blend toward destination (\u0e25\u0e14\u0e01\u0e23\u0e30\u0e15\u0e38\u0e01)'
          old_v = 'local MONSTER_VERTICAL_LERP = 0.40'
          new_v = 'local MONSTER_VERTICAL_LERP = 0.26'
          if old_h not in text or text.count(old_v) < 1:
              raise SystemExit('constants not found')
          text = text.replace(old_h, new_h, 1)
          text = text.replace(old_v, new_v, 1)
          old = (
              '      -- blend: slightly more responsive when far, softer when close\n'
              '      local farFactor = math.clamp(distance / 20, 0, 1)\n'
              '      local alphaH = math.clamp(MONSTER_HORIZONTAL_LERP + 0.10 + farFactor * 0.12, 0.14, 0.72)\n'
              '      local alphaV = aerial\n'
              '         and math.clamp(MONSTER_VERTICAL_LERP + 0.25, 0.2, 0.9)\n'
              '         or math.clamp(MONSTER_VERTICAL_LERP, 0.12, 0.75)'
          )
          new = (
              '      -- blend: softer overall, less aggressive when close (\u0e25\u0e14\u0e01\u0e23\u0e30\u0e15\u0e38\u0e01)\n'
              '      local farFactor = math.clamp(distance / 28, 0, 1)\n'
              '      local alphaH = math.clamp(MONSTER_HORIZONTAL_LERP + farFactor * 0.18, 0.12, 0.58)\n'
              '      local alphaV = aerial\n'
              '         and math.clamp(MONSTER_VERTICAL_LERP + 0.18, 0.18, 0.72)\n'
              '         or math.clamp(MONSTER_VERTICAL_LERP + farFactor * 0.08, 0.10, 0.55)'
          )
          if old not in text:
              raise SystemExit('alpha block not found')
          text = text.replace(old, new, 1)
          if len(text.encode('utf-8')) < 300000:
              raise SystemExit('patched file too small')
          path.write_text(text, encoding='utf-8')
          print('patched', len(text.encode('utf-8')))
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < main.lua)" -ge 300000
          grep -qF 'MONSTER_HORIZONTAL_LERP = 0.18' main.lua
          grep -qF 'distance / 28' main.lua
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- main.lua
          if git diff --cached --quiet; then
            echo 'already up to date'
            exit 0
          fi
          git commit -m 'Monster Warp: soften Lerp to reduce stutter'
          git push origin HEAD:main
